# ============================================================
#  data_config.yaml — SEHEMU 1 (Tabaka la Data) ya EliteFX
#  Inatumika na src/data/*. Japhet anabadilisha values; mfumo unasoma tu.
# ============================================================

# --- Pairs 9 kuu (kama MFUMO.md) ---
pairs:
  - EURUSD
  - GBPUSD
  - USDJPY
  - EURJPY
  - USDCAD
  - USDCHF
  - AUDUSD
  - NZDUSD
  - EURGBP

# --- Timeframes za kujenga kutoka ticks ---
# 1m–30m: microstructure ya Model 2 (Entry, Sehemu 3). H1–D1: HTF ya Model 1
# (Regime, Sehemu 2 — pamoja na H2). 5m ni nyongeza ya analyst kwa entry.
timeframes: [1m, 5m, 15m, 30m, H1, H2, H4, D1]

# --- Kipindi cha mafunzo (MFUMO.md: 2016–2024). 2025–2026 = OOS ya ziada ---
date_range:
  train_start: "2016-01-01"
  train_end:   "2024-12-31"

# --- Timezone ---
# Data ghafi iko CE(S)T (Europe/Berlin, yenye DST). Tunaconvert -> UTC
# mara moja kwenye ingest; candles zote & session boundaries ni UTC.
timezone:
  source_tz:  "Europe/Berlin"   # jinsi timestamps za raw zilivyo
  store_tz:   "UTC"             # jinsi tutakavyohifadhi (lazima UTC)

# --- Njia (relative kwa root ya repo; data iko nje ya git) ---
paths:
  raw_ticks:  "data/raw/ticks"        # Hive: symbol=*/year=*/.../day=*
  interim:    "data/interim"          # ticks normalized (Parquet)
  processed:  "data/processed"        # candles kwa kila TF (Parquet)
  reports:    "reports"

# --- Resampling ---
# OHLC inajengwa kutoka bid (default) au mid; spread inahifadhiwa pembeni.
resample:
  price_for_ohlc: "bid"   # "bid" | "mid"
  bar_timestamp:  "open"  # bar inawekewa muda wa kufunguka (kuzuia lookahead)
  label_closed_only: true # bar inatumika tu ikiwa imekamilika (is_complete=true)

# --- Sessions (UTC, takriban — zitathibitishwa kwa EDA) ---
sessions_utc:
  asia:
    start: "23:00"
    end: "08:00"
  london:
    start: "07:00"
    end: "16:00"
  newyork:
    start: "12:00"
    end: "21:00"

# --- No-trade window: rollover (kutoka EDA) ---
# Spread inapanda mara 3+ wakati wa rollover ya broker. Tunaanchor kwa CE(S)T
# (broker local) si UTC: rollover ni saa 23:00 CET, inayohama 21:00/22:00 UTC kwa
# DST. Code itabadilisha bar_open(UTC) -> Europe/Berlin kuangalia saa hizi.
no_trade_window:
  tz:    "Europe/Berlin"   # broker local time (DST-aware)
  hours: [23, 0]           # 23:00–01:00 CET = rollover (+ ukingo); = 21–23 UTC kwa misimu

# --- Max spread kwa pair (DATA-DRIVEN kutoka EDA, pips) ---
# Hizi ni za BACKTEST (Dukascopy spread) — flag bars zenye spread isiyo ya kawaida
# (~p95–p99 kwa kila pair). Kizingiti cha LIVE Compliance (Sehemu 5) ni cha FTMO
# MT5 (pana zaidi) — kitawekwa kando tukiwa na data ya live. Japhet anaweza kurekebisha.
max_spread_pips:
  EURUSD: 1.5    # med 0.30, p95 0.65
  GBPUSD: 3.0    # med 0.88, p95 1.89
  USDJPY: 2.0    # med 0.39, p95 1.04
  EURJPY: 3.0    # med 0.72, p95 1.81
  USDCAD: 3.5    # med 1.15, p95 2.08
  USDCHF: 3.0    # med 0.99, p95 1.96
  AUDUSD: 2.5    # med 0.98, p95 1.55
  NZDUSD: 3.0    # med 1.06, p95 1.84
  EURGBP: 3.0    # med 0.87, p95 1.91

# --- Vigezo vya quality checks ---
quality:
  max_gap_minutes: 60        # pengo kubwa zaidi linalokubalika ndani ya session
  outlier_sigma:   8         # bei nje ya hii (z-score) = mshukiwa
  min_year_coverage: 0.90    # angalau 90% ya siku za biashara kila mwaka
  min_tick_count:    3       # bar yenye ticks chini ya hii = liquidity ndogo (filter)
