#  Kuongeza KAIROS mpya = kuongeza block hapa (baada ya kupita GATE ya doctrine §3).
#  TAHADHARI: pairs = zile zilizofanya vizuri kwenye UTAFITI wa model hiyo (si kubahatisha).
# ============================================================

models:
