    pairs:      [USDCHF]          # pairs ZOTE zilizoruhusiwa (model inascan zote)
    sl_atr:     2.0               # SL = 2.0 x ATR(14)
    tp_atr:     1.0               # TP = 1.0 x ATR(14)
    learned_ev: 1.92              # EV ya HOLDOUT (pips/trade) — kwa Steward divergence
    magic:      20260730001       # kitambulisho cha EA (kipekee kwa kila model)

