{% extends "monitor/base.html" %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto">
<h1>GLASS BOX — login</h1>
{% if form.errors %}<p class="neg">Jina/nywila si sahihi.</p>{% endif %}
<form method="post">{% csrf_token %}
  <p><input name="username" placeholder="username" autofocus style="width:100%"></p>
  <p><input type="password" name="password" placeholder="password" style="width:100%"></p>
  <p><button type="submit">INGIA</button></p>
</form>
<p class="src">read-only monitoring — hakuna trade inayoanzishwa hapa (V2 §4).</p>
</div>
{% endblock %}
